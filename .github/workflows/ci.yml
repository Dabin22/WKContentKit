name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Test package
        run: >-
          xcodebuild test
          -scheme WKContentKit-Package
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO

      - name: Build demo app
        run: >-
          xcodebuild build
          -project Examples/DemoApp/DemoApp.xcodeproj
          -scheme DemoApp
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
